<!doctype html>
<!--
  Página de error 404 estática. Cloudflare Pages la sirve con estado 404 para cualquier ruta que
  no exista; sin ella, trata la web como una SPA y responde con la portada. No carga JavaScript.
-->
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada · JobRadar ATS</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        --background: #fafafb;
        --surface: #ffffff;
        --border: #e7e6ee;
        --text: #15141a;
        --text-secondary: #47454f;
        --primary: #5b4be8;
        --on-primary: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0e0d14;
          --surface: #16151f;
          --border: #2a2836;
          --text: #f4f3fa;
          --text-secondary: #c4c2d0;
          --primary: #6c5cf0;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--background);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 420px;
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0 0 24px;
        color: var(--text-secondary);
        line-height: 1.5;
      }
      a {
        display: inline-block;
        min-height: 44px;
        padding: 12px 20px;
        box-sizing: border-box;
        border-radius: 10px;
        background: var(--primary);
        color: var(--on-primary);
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid var(--text);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Página no encontrada</h1>
      <p>
        Esta dirección no existe en JobRadar ATS. Puede que el enlace esté mal escrito o ya no
        exista.
      </p>
      <a href="/">Ir al inicio</a>
    </main>
  </body>
</html>
